<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universități din România</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/universities_style.css">
</head>

<body>
<header>
    <div class="container">
        <a href="home.html" class="brand">
            <span class="brand-logo">TW</span>
            <span>Comunitatea de Tehnologii Web 2026</span>
        </a>
        <nav>
            <a href="home.html">Acasă</a>
            <a href="#">Tehnologii</a>
            <a href="universities.html" class="active">Universități</a>
            <a href="galerie.html">Galerie</a>
            <a href="chatbot.html">ChatBot</a>
            <a href="login.html" class="logout">Logout</a>
        </nav>
    </div>
</header>

<main class="container uni-page">
    <h1>Universități din România</h1>

    <div class="toolbar">
        <div class="filter">
            <label for="q">Filtru (opțional):</label>
            <input id="q" type="search" placeholder="caută după nume…" autocomplete="off">
        </div>
        <button id="exportBtn" type="button" class="btn primary">Export CSV</button>
    </div>

    <div id="status" class="status" aria-live="polite"></div>

    <div class="table-card" role="region" aria-label="Tabelul universităților" tabindex="0">
        <table>
            <thead>
            <tr>
                <th scope="col">Nume</th>
                <th scope="col">Țara</th>
                <th scope="col">Site</th>
            </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
</main>

<footer>
    <div class="container">
        <p>&copy; 2026 Comunitatea de Tehnologii Web</p>
        <p>
            <a href="https://uvt.ro">Universitatea de Vest din Timișoara</a>
            <span class="sep">|</span>
            <a href="https://info.uvt.ro">Facultatea de Informatică</a>
        </p>
    </div>
</footer>

<script src="../js/universities_js.js"></script>
</body>
</html>
